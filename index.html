<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Checklists by Bejhan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#6366f1;--accent2:#818cf8;--danger:#ef4444;--success:#22c55e;--sidebar-w:240px;--r:16px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.14)}
html.dark{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
#shell{display:flex;min-height:100dvh}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow-y:auto;padding:20px 12px;transition:transform .25s ease}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar-logo svg{width:28px;height:28px;flex-shrink:0}
.sidebar-logo .lname{font-weight:700;font-size:15px;letter-spacing:-.3px}
.sidebar-logo .lsub{font-size:11px;color:var(--muted);font-weight:400;display:block;letter-spacing:0}
nav.snav{flex:1;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s;font-family:inherit}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item.hidden{display:none}
.suser{border-top:1px solid var(--border);padding-top:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.suser .uname{font-weight:600;color:var(--text);font-size:14px;display:block;margin-bottom:2px}
.suser .uemail{font-size:12px;word-break:break-all}
.suser button{margin-top:10px;width:100%;background:none;border:1px solid var(--border);border-radius:8px;padding:7px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .15s}
.suser button:hover{background:var(--bg);color:var(--text)}
.acting-badge{display:none;align-items:center;gap:6px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px}
.acting-badge.show{display:flex}
.acting-badge button{background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted);line-height:1;padding:0}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:none;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
#topbar .logo-text{font-weight:700;font-size:16px;flex:1}
#menuBtn{background:none;border:none;cursor:pointer;color:var(--text);padding:4px;display:flex}
.page-header{padding:24px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
.page-sub{font-size:14px;color:var(--muted);margin-top:2px}
#content{padding:20px 24px 32px;flex:1}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.cl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;cursor:pointer;transition:box-shadow .18s,transform .18s,border-color .18s;display:flex;gap:14px;align-items:flex-start}
.cl-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--accent)}
.cl-ring{flex-shrink:0;width:52px;height:52px}
.cl-ring svg{width:52px;height:52px}
.cl-body{flex:1;min-width:0}
.cl-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-desc{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-meta{font-size:12px;color:var(--muted);margin-top:6px}
.cl-actions{display:flex;gap:6px;margin-top:10px}
.cl-actions button{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s,color .15s}
.cl-actions button:hover{background:var(--bg);color:var(--text)}
.cl-actions .btn-arch:hover{background:#fef2f2;color:var(--danger);border-color:#fca5a5}
#detailOverlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .22s ease}
#detailOverlay.open{opacity:1;pointer-events:all}
#detailPanel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:101}
#detailOverlay.open #detailPanel{transform:translateX(0)}
.detail-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.detail-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;border-radius:8px;transition:background .15s;flex-shrink:0}
.detail-close:hover{background:var(--bg)}
.detail-title{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-body{flex:1;overflow-y:auto;padding:20px}
.detail-progress-bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.detail-progress-bar .bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s ease}
.detail-progress-label{font-size:13px;color:var(--muted)}
.cat-block{margin-bottom:18px}
.cat-block h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.cat-inner{background:var(--bg);border-radius:12px;overflow:hidden}
.checkrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border)}
.checkrow:first-child{border-top:none}
.checkrow input[type=checkbox]{width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:var(--accent)}
.checkrow label{cursor:pointer;flex:1;font-size:14px;transition:color .15s}
.checkrow label.done{text-decoration:line-through;color:var(--muted)}
.inline-add{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--border)}
.inline-add input{flex:1;border:none;background:transparent;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.inline-add input::placeholder{color:var(--muted)}
.inline-add button{background:var(--accent);color:#fff;border:none;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.inline-add button:hover{opacity:.85}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.tpl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tpl-card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tpl-icon{font-size:24px;line-height:1}
.tpl-name{font-weight:600;font-size:15px}
.tpl-desc{font-size:12px;color:var(--muted);margin-bottom:12px}
.tpl-actions{display:flex;gap:6px;flex-wrap:wrap}
#tplEditorWrap{display:none;margin-top:20px}
#tplEditorWrap.show{display:block}
.editor-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.editor-card h2{font-size:17px;font-weight:700;margin-bottom:16px}
.cat-editor{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.cat-editor-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cat-editor-head h4{flex:1;font-size:14px;font-weight:600;margin:0}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.user-row:first-child{border-top:none}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-info .uname{font-weight:600;font-size:14px}
.user-info .uemail{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:#fef2f2;border:1px solid #fca5a5;color:var(--danger)}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
#modalOverlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s ease}
#modalOverlay.open{opacity:1;pointer-events:all}
.modal-box{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px;width:100%;max-width:400px;transform:scale(.95) translateY(10px);transition:transform .22s ease}
#modalOverlay.open .modal-box{transform:scale(1) translateY(0)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:14px;color:var(--muted);margin-bottom:4px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#f8fafc;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.3);z-index:300;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loader{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:250;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#loader.show{opacity:1;pointer-events:all}
.loader-box{background:var(--surface);border-radius:16px;padding:20px 28px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);font-weight:600;font-size:15px}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
#loginScreen{display:none;min-height:100dvh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);padding:20px}
#loginScreen.show{display:flex}
.login-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:36px 32px;width:100%;max-width:380px;backdrop-filter:blur(20px)}
.login-logo{margin-bottom:28px;text-align:center}
.login-logo svg{width:44px;height:44px;margin-bottom:10px}
.login-logo h1{font-size:22px;font-weight:700;color:#f1f5f9;letter-spacing:-.4px}
.login-logo p{font-size:13px;color:#94a3b8;margin-top:4px}
.login-box .form-group label{color:#94a3b8}
.login-box .form-group input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#f1f5f9}
.login-box .form-group input:focus{border-color:var(--accent);background:rgba(255,255,255,.08)}
#loginBtn{width:100%;padding:12px;font-size:15px;margin-top:4px;border-radius:12px}
#loginMsg{text-align:center;font-size:13px;color:#ef4444;margin-top:10px;min-height:18px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.tpl-section{margin-bottom:28px}
.tpl-section-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px;padding:0 2px}
.tpl-section-title svg{width:14px;height:14px;flex-shrink:0}
.tpl-section-divider{height:1px;background:var(--border);margin-bottom:12px}
.drag-handle{display:flex;align-items:center;cursor:grab;color:var(--border);padding:0 4px 0 0;flex-shrink:0;touch-action:none;transition:color .15s}
.drag-handle:hover{color:var(--muted)}
.cat-drag-handle{display:flex;align-items:center;cursor:grab;color:var(--border);padding:2px 6px 2px 0;touch-action:none;transition:color .15s}
.cat-drag-handle:hover{color:var(--muted)}
.dragging{opacity:.35}
.drag-over-top{box-shadow:0 -2px 0 var(--accent)!important}
.drag-over-bottom{box-shadow:0 2px 0 var(--accent)!important}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:.5}
.empty-title{font-size:16px;font-weight:600;margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--muted);margin-bottom:20px}
#bottomNav{display:none}
@media(max-width:768px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:50;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  #sidebar.open{transform:translateX(0)}
  #sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:49}
  #sidebarBackdrop.show{display:block}
  #topbar{display:flex}
  #main{padding-bottom:70px}
  .page-header{padding:16px 16px 0}
  #content{padding:16px}
  #bottomNav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:40}
  .bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border:none;background:none;cursor:pointer;font-size:11px;font-weight:500;color:var(--muted);font-family:inherit;border-radius:10px;transition:background .15s,color .15s}
  .bnav-item svg{width:22px;height:22px}
  .bnav-item.active{color:var(--accent)}
  .bnav-item.hidden{display:none}
  .cl-grid,.tpl-grid{grid-template-columns:1fr}
  .page-title{font-size:19px}
  #detailPanel{width:100vw;border-left:none;border-radius:20px 20px 0 0;top:auto;height:92dvh;transform:translateY(100%)}
  #detailOverlay.open #detailPanel{transform:translateY(0)}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="12" fill="url(#lg)"/><path d="M14 22h6m0 0 4-6 4 6M20 22v6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="44" y2="44"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs></svg>
      <h1>Checklists</h1>
      <p>Melde dich an, um fortzufahren</p>
    </div>
    <div class="form-group"><label>E-Mail</label><input id="loginEmail" type="email" autocomplete="email" placeholder="name@domain.ch"></div>
    <div class="form-group"><label>Passwort</label><input id="loginPw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="loginBtn">Anmelden</button>
    <p id="loginMsg"></p>
  </div>
</div>

<div id="shell" style="display:none">
  <div id="sidebarBackdrop"></div>
  <aside id="sidebar">
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px" id="desktopActions">
      <button id="darkToggleDesktop" title="Dark Mode" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;transition:background .15s,color .15s">
        <svg id="darkIconDesktop" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
      </button>
      <button id="logoutBtnDesktop" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap">Abmelden</button>
    </div>
    <div class="sidebar-logo">
      <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="url(#slg)"/><path d="M9 14h4m0 0 3-4 3 4M13 14v4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="slg" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs></svg>
      <div><span class="lname">Checklists</span><span class="lsub">by Bejhan</span></div>
    </div>
    <div class="acting-badge" id="actingBadge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span id="actingName">—</span>
      <button id="stopActing" title="Beenden">✕</button>
    </div>
    <nav class="snav">
      <button class="nav-item active" id="bCheck">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M9 12l2 2 4-4"/></svg>Checklisten
      </button>
      <button class="nav-item" id="bTpl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Vorlagen
      </button>
      <button class="nav-item hidden" id="bAdmin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 11l1.5 1.5L21 9"/></svg>Admin
      </button>
    </nav>
    <div class="suser">
      <span class="uname" id="sUserName">—</span>
      <span class="uemail" id="sUserEmail">—</span>
      <button id="logoutBtn">Abmelden</button>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="menuBtn" aria-label="Menü"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <span class="logo-text">Checklists</span>
    </header>

    <div id="content">
      <div id="vCheck">
        <div class="page-header">
          <div><h1 class="page-title">Checklisten</h1><p class="page-sub" id="checkSub">Lade…</p></div>
          <button class="btn btn-ghost btn-sm" id="refreshCheck"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>Aktualisieren</button>
        </div>
        <div id="checkList" style="margin-top:18px"></div>
      </div>

      <div id="vTpl" style="display:none">
        <div class="page-header">
          <div><h1 class="page-title">Vorlagen</h1><p class="page-sub">Vorlagen verwalten und Checklisten erstellen</p></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" id="seedMore">Standardvorlagen</button>

const $=id=>document.getElementById(id),q=t=>document.createElement(t);
function on(id,fn){const el=$(id);if(el)el.onclick=fn}

function toast(msg,dur=2400){const el=$("toast");el.innerHTML=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),dur)}

function showModal({title,sub="",input=null,danger=false,confirmLabel="OK"}){
  return new Promise(resolve=>{
    $("modalTitle").textContent=title;$("modalSub").textContent=sub;
    const wrap=$("modalInputWrap");
    if(input){wrap.style.display="";$("modalInputLabel").textContent=input.label||"";$("modalInput").value=input.value||"";$("modalInput").placeholder=input.placeholder||"";setTimeout(()=>$("modalInput").focus(),80)}
    else{wrap.style.display="none"}
    $("modalConfirm").textContent=confirmLabel;
    $("modalConfirm").className="btn btn-sm "+(danger?"btn-danger":"btn-primary");
    $("modalOverlay").classList.add("open");
    const close=val=>{$("modalOverlay").classList.remove("open");$("modalConfirm").onclick=null;$("modalCancel").onclick=null;$("modalInput").onkeydown=null;resolve(val)};
    $("modalConfirm").onclick=()=>close(input?$("modalInput").value.trim():true);
    $("modalCancel").onclick=()=>close(null);
    $("modalInput").onkeydown=e=>{if(e.key==="Enter")close(input?$("modalInput").value.trim():true);if(e.key==="Escape")close(null)};
  })
}

function showSelectModal(title,currentVal,values,labels){
  return new Promise(resolve=>{
    $("modalTitle").textContent=title;$("modalSub").textContent="";

    const inp=$("modalInput");inp.style.display="none";
    let sel=document.getElementById("modalSelect");
    if(!sel){sel=document.createElement("select");sel.id="modalSelect";sel.className=inp.className;inp.parentNode.insertBefore(sel,inp.nextSibling)}
    sel.style.display="";sel.innerHTML=values.map((v,i)=>`<option value="${v}"${v===currentVal?" selected":""}>${labels[i]}</option>`).join("");
    $("modalConfirm").textContent="OK";$("modalConfirm").className="btn btn-sm btn-primary";
    $("modalOverlay").classList.add("open");
    const close=val=>{$("modalOverlay").classList.remove("open");inp.style.display="";sel.style.display="none";$("modalConfirm").onclick=null;$("modalCancel").onclick=null;resolve(val)};
    $("modalConfirm").onclick=()=>close(sel.value);
    $("modalCancel").onclick=()=>close(null);
    setTimeout(()=>sel.focus(),80);
  })
}

});

function ringSVG(pct){
  const r=20,c=2*Math.PI*r,offset=c-(pct/100)*c;
  const color=pct===100?"#22c55e":"#6366f1";
  const track=pct===100?"rgba(34,197,94,.2)":"#e2e8f0";
  return `<svg width="52" height="52" viewBox="0 0 48 48"><circle cx="24" cy="24" r="${r}" fill="none" stroke="${track}" stroke-width="4"/><circle cx="24" cy="24" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" stroke-linecap="round" transform="rotate(-90 24 24)"/><text x="24" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="${color}" font-family="Inter,sans-serif">${pct}%</text></svg>`;
}

function celebrate(){
  const canvas=$("confetti");if(!canvas)return;canvas.classList.add("show");
  const ctx=canvas.getContext("2d");canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const colors=["#6366f1","#818cf8","#22c55e","#f59e0b","#ec4899","#06b6d4"];
  const pieces=Array.from({length:80},()=>({x:Math.random()*canvas.width,y:-20,vx:(Math.random()-.5)*4,vy:Math.random()*4+2,r:Math.random()*6+3,color:colors[Math.floor(Math.random()*colors.length)],angle:Math.random()*360,va:(Math.random()-.5)*8,life:1}));
  let frame=0;
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.angle+=p.va;p.life-=.012;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle*Math.PI/180);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});frame++;if(frame<120)requestAnimationFrame(draw);else{canvas.classList.remove("show");ctx.clearRect(0,0,canvas.width,canvas.height)}}
  draw();
}

function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function escAttr(s){return String(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit",year:"2-digit"})}

function show(v){
  ["Check","Tpl","Admin"].forEach(x=>{
    $("v"+x).style.display=x===v?"":"none";
    $("b"+x)?.classList.toggle("active",x===v);
    $("bb"+x)?.classList.toggle("active",x===v);
  });
  closeSidebar();
  if(v==="Admin")loadUsers();
}

function closeSidebar(){$("sidebar").classList.remove("open");$("sidebarBackdrop").classList.remove("show")}

function initTitleEdit(id,currentTitle){
  const titleEl=$("detailTitle"),editEl=$("detailTitleEdit");
  titleEl.onclick=()=>{editEl.value=currentTitle;titleEl.classList.add("editing");editEl.classList.add("active");editEl.focus();editEl.select()};
  const saveTitle=async()=>{
    const val=editEl.value.trim();titleEl.classList.remove("editing");editEl.classList.remove("active");
    if(!val||val===currentTitle)return;

    currentTitle=val;titleEl.textContent=val;panelDirty=true;toast("Titel gespeichert");

  editEl.onblur=saveTitle;
  editEl.onkeydown=e=>{if(e.key==="Enter")saveTitle();if(e.key==="Escape"){titleEl.classList.remove("editing");editEl.classList.remove("active")}};
}

/* ── Dark mode ── */
const MOON_ICON='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const SUN_ICON='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';

/* ── Checklists ── */
async function loadChecklists(){
  const box=$("checkList");
  box.innerHTML='<div style="display:flex;justify-content:center;padding:48px"><div class="spinner"></div></div>';
  const{data,error}=await sb.from("checklists").select("*").is("deleted_at",null).order("created_at",{ascending:false});
  if(error){box.textContent=error.message;return}
  const count=data?data.length:0;
  $("checkSub").textContent=count?count+" Checklist"+(count!==1?"en":""):"";
  if(!count){
    box.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">Noch keine Checklisten</div><div class="empty-sub">Erstelle eine Checkliste aus einer Vorlage.</div><button class="btn btn-primary" id="goTpl">Zu den Vorlagen</button></div>';
    $("goTpl").onclick=()=>show("Tpl");return;
  }
  const clIds=data.map(cl=>cl.id);
  const allCats=await sb.from("checklist_categories").select("id,checklist_id").in("checklist_id",clIds);
  const catIds=(allCats.data||[]).map(c=>c.id);
  const allItems=catIds.length?await sb.from("checklist_items").select("category_id,is_checked").in("category_id",catIds):{data:[]};
  const catToCl={};(allCats.data||[]).forEach(c=>catToCl[c.id]=c.checklist_id);
  const prog={};clIds.forEach(id=>prog[id]={done:0,total:0});
  (allItems.data||[]).forEach(it=>{const cl=catToCl[it.category_id];if(!cl)return;prog[cl].total++;if(it.is_checked)prog[cl].done++});
  const grid=q("div");grid.className="cl-grid";
  (data||[]).forEach(cl=>{
    const{done,total}=prog[cl.id]||{done:0,total:0};
    const pct=total?Math.round(done/total*100):0;
    const isComplete=total>0&&pct===100;
    const card=q("div");card.className="cl-card"+(isComplete?" done-card":"");
    const doneBadge=isComplete?'<span class="cl-done-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>Fertig</span>':"";
    card.innerHTML='<div class="cl-ring">'+ringSVG(pct)+'</div><div class="cl-body"><div class="cl-title">'+escHtml((cl.icon||"📋")+" "+cl.title)+'</div><div class="cl-desc">'+escHtml(cl.description||"Keine Beschreibung")+'</div><div class="cl-meta"><span>'+done+"/"+total+' erledigt</span>'+doneBadge+'<span class="cl-date">'+fmtDate(cl.created_at)+'</span></div><div class="cl-actions"><button class="btn-dup">Duplizieren</button><button class="btn-arch">Archivieren</button></div></div>';
    card.querySelector(".btn-dup").onclick=e=>{e.stopPropagation();duplicateChecklist(cl.id)};
    card.querySelector(".btn-arch").onclick=e=>{e.stopPropagation();archiveChecklist(cl.id)};
    card.onclick=()=>openDetailPanel(cl.id);
    grid.appendChild(card);
  });
  box.innerHTML="";box.appendChild(grid);
}

async function loadDetailPanel(id){
  const body=$("detailBody");
  body.innerHTML='<div style="display:flex;justify-content:center;padding:48px"><div class="spinner"></div></div>';
  const[clRes,catsRes]=await Promise.all([sb.from("checklists").select("*").eq("id",id).single(),sb.from("checklist_categories").select("*").eq("checklist_id",id).order("sort_order")]);
  const cl=clRes.data;
  $("detailTitle").textContent=(cl.icon||"📋")+" "+cl.title;
  $("detailTitle").title="Titel klicken zum Bearbeiten";
  $("detailArchive").onclick=()=>archiveChecklist(id,true);
  initTitleEdit(id,cl.title);
  const catIds=(catsRes.data||[]).map(c=>c.id);
  const itemsRes=catIds.length?await sb.from("checklist_items").select("*").in("category_id",catIds).order("sort_order"):{data:[]};
  const itemsByCat={};(itemsRes.data||[]).forEach(it=>{(itemsByCat[it.category_id]=itemsByCat[it.category_id]||[]).push(it)});
  let total=0,done=0;(itemsRes.data||[]).forEach(it=>{total++;if(it.is_checked)done++});
  const pct=total?Math.round(done/total*100):0;
  let wasComplete=pct===100&&total>0;
  function buildProgress(dn,tot){
    const p=tot?Math.round(dn/tot*100):0,complete=p===100&&tot>0;
    const barClass=complete?"bar complete":"bar";
    const banner=complete?'<div class="complete-banner"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>Alle Punkte erledigt!</div>':"";
    return '<div class="progress-wrap">'+banner+'<div class="detail-progress-bar"><div class="'+barClass+'" style="width:'+p+'%"></div></div><div class="detail-progress-label">'+dn+' von '+tot+' erledigt · '+p+'%</div></div>';
  }
  body.innerHTML=buildProgress(done,total);
  function refreshProgress(){
    const allCbs=body.querySelectorAll('input[type=checkbox]');
    const tot=allCbs.length,dn=[...allCbs].filter(c=>c.checked).length;
    const nowComplete=dn===tot&&tot>0;
    const old=body.querySelector(".progress-wrap");if(old)old.outerHTML=buildProgress(dn,tot);
    if(nowComplete&&!wasComplete){celebrate();wasComplete=true}
  }
  if(!catsRes.data||!catsRes.data.length){body.innerHTML+=`<div class="empty-cat-hint">Noch keine Kategorien. Klicke oben auf „+ Kategorie", um loszulegen.</div>`;return}
  const catContainer=q("div");catContainer.id="cat-container-"+id;
  for(const cat of catsRes.data){
    const block=q("div");block.className="cat-block";block.dataset.catId=cat.id;
    const catHead=q("div");catHead.className="cat-header";
    const catHandle=q("div");catHandle.className="cat-drag-handle";catHandle.title="Ziehen zum Sortieren";
    catHandle.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/></svg>';
    const catTitle=q("h3");catTitle.textContent=cat.title;
    const catDel=q("button");catDel.className="cat-del-btn";catDel.textContent="×";catDel.title="Kategorie löschen";
    catDel.onclick=async()=>{
      const ok=await showModal({title:"Kategorie löschen?",sub:'"'+cat.title+'" und alle Einträge werden gelöscht.',confirmLabel:"Löschen",danger:true});
      if(!ok)return;loading(true,"Lösche…");
      await sb.from("checklist_items").delete().eq("category_id",cat.id);
      await sb.from("checklist_categories").delete().eq("id",cat.id);
      loading(false);toast("Kategorie gelöscht");panelDirty=true;loadDetailPanel(id);
    };
    catHead.append(catHandle,catTitle,catDel);block.appendChild(catHead);
    const inner=q("div");inner.className="cat-inner";
    const items=itemsByCat[cat.id]||[];
    items.forEach(it=>inner.appendChild(makeCheckrow(it,id,inner,refreshProgress)));
    const addRow=q("div");addRow.className="inline-add";
    const inp=q("input");inp.placeholder="Neuer Eintrag…";
    const plusBtn=q("button");plusBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M12 5v14M5 12h14"/></svg>';
    const doAdd=async()=>{
      const title=inp.value.trim();if(!title)return;
      plusBtn.disabled=true;loading(true,"Speichere…");
      const res=await sb.from("checklist_items").insert({category_id:cat.id,title,sort_order:Date.now()%100000,is_checked:false}).select().single();
      loading(false);plusBtn.disabled=false;
      if(res.error){alert(res.error.message);return}
      inp.value="";toast("Eintrag hinzugefügt");panelDirty=true;
      inner.insertBefore(makeCheckrow(res.data,id,inner,refreshProgress),addRow);refreshProgress();inp.focus();
    };
    plusBtn.onclick=doAdd;inp.onkeydown=e=>{if(e.key==="Enter")doAdd()};
    addRow.append(inp,plusBtn);inner.appendChild(addRow);

/* ── Pointer drag ── */
let _drag=null;
function _pointerDrag(handle,el,container,{selector,onDone}){
  let pressTimer=null;
  handle.style.touchAction="none";
  handle.addEventListener("pointerdown",e=>{
    if(e.button!==0&&e.pointerType==="mouse")return;
    if(e.pointerType==="touch"){
      const cancelOnMove=()=>{clearTimeout(pressTimer);handle.removeEventListener("pointermove",cancelOnMove)};
      handle.addEventListener("pointermove",cancelOnMove,{once:true,passive:true});
      pressTimer=setTimeout(()=>startDrag(e),400);
    } else startDrag(e);
  });
  function startDrag(e){
    clearTimeout(pressTimer);if(_drag)return;
    navigator.vibrate&&navigator.vibrate(40);
    handle.setPointerCapture(e.pointerId);
    const rect=el.getBoundingClientRect();
    const ghost=el.cloneNode(true);
    ghost.style.cssText="position:fixed;left:"+rect.left+"px;top:"+rect.top+"px;width:"+rect.width+"px;opacity:.85;pointer-events:none;z-index:9999;background:var(--surface);border-radius:10px;box-shadow:var(--shadow-lg);transition:none";
    document.body.appendChild(ghost);
    el.classList.add("dragging");
    _drag={el,container,ghost,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,selector,onDone,lastTarget:null};
    handle.addEventListener("pointermove",onMove);
    handle.addEventListener("pointerup",onUp,{once:true});
    handle.addEventListener("pointercancel",onUp,{once:true});
  }
  function onMove(e){
    if(!_drag)return;
    const{ghost,el,container,offsetX,offsetY,selector}=_drag;
    ghost.style.left=(e.clientX-offsetX)+"px";ghost.style.top=(e.clientY-offsetY)+"px";
    ghost.style.display="none";
    const under=document.elementFromPoint(e.clientX,e.clientY);
    ghost.style.display="";
    const target=under?under.closest(selector):null;
    clearIndicators(container,selector);
    if(target&&target!==el&&target.parentNode===container){
      const r=target.getBoundingClientRect(),above=e.clientY<r.top+r.height/2;
      target.classList.add(above?"drag-over-top":"drag-over-bottom");
      _drag.lastTarget={target,above};
    } else _drag.lastTarget=null;
  }
  function onUp(){
    if(!_drag)return;
    handle.removeEventListener("pointermove",onMove);
    const{el,container,ghost,lastTarget,onDone,selector}=_drag;
    ghost.remove();el.classList.remove("dragging");clearIndicators(container,selector);
    if(lastTarget){const{target,above}=lastTarget;if(above)container.insertBefore(el,target);else target.after(el)}
    _drag=null;onDone(container);
  }
}
function clearIndicators(container,selector){container.querySelectorAll(selector).forEach(el=>el.classList.remove("drag-over-top","drag-over-bottom"))}
function attachItemDrag(handle,row,container){_pointerDrag(handle,row,container,{selector:".checkrow",onDone:saveItemOrder})}

async function seedStandardTemplates(){
  const templates=[["Camping","Packliste fürs Camping","🏕️","Schlafen\n- Zelt\n- Schlafsack\n- Isomatte\n\nKochen\n- Gaskocher\n- Geschirr\n- Besteck\n- Wasser"],["Wandern","Vorlage für Wanderausflüge","🎒","Ausrüstung\n- Wanderschuhe\n- Rucksack\n- Regenjacke\n\nVerpflegung\n- Wasser\n- Snacks\n- Sandwich"],["Flugreise","Vorlage für Reisen mit Flug","✈️","Dokumente\n- Pass/ID\n- Boardingpass\n- Versicherung\n\nHandgepäck\n- Kopfhörer\n- Ladegerät\n- Powerbank"],["Einkauf","Allgemeine Einkaufsliste","🛒","Lebensmittel\n- Brot\n- Milch\n- Früchte\n\nHaushalt\n- Küchenpapier\n- Müllsäcke"]];
  loading(true,"Prüfe Vorlagen…");
  const{data:existing}=await sb.from("templates").select("title").is("deleted_at",null);
  const existingTitles=new Set((existing||[]).map(t=>t.title));
  const toCreate=templates.filter(t=>!existingTitles.has(t[0]));
  if(!toCreate.length){loading(false);toast("Alle Standardvorlagen sind bereits vorhanden.");return}
  for(const t of toCreate)await createTemplateFromSeed(t);
  loading(false);await loadTemplates();toast(toCreate.length+" Vorlage"+(toCreate.length!==1?"n":"")+" hinzugefügt");
}

async function createTemplateFromSeed(t){
  const r=await sb.from("templates").insert({organization_id:orgId,owner_id:owner(),created_by:user.id,updated_by:user.id,title:t[0],description:t[1],icon:t[2],is_global:isSuper}).select().single();
  if(r.error)return;let cur=null,n=10,i=10;
  for(const line of t[3].split("\n").map(x=>x.trim()).filter(Boolean)){
    if(line.startsWith("-")){if(cur)await sb.from("template_items").insert({category_id:cur,title:line.replace(/^-\s*/,""),sort_order:i});i+=10}
    else{const c=await sb.from("template_categories").insert({template_id:r.data.id,title:line,sort_order:n}).select().single();cur=c.data.id;n+=10;i=10}
  }
}

function openEditUserPanel(u,currentRole){
  const overlay=$("editUserOverlay"),panel=$("editUserPanel");
  $("editUserTitle").textContent=u.display_name||u.email||"Benutzer bearbeiten";
  const body=$("editUserBody");
  body.innerHTML='<div style="background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--muted)"><span style="font-weight:600;color:var(--text)">'+escHtml(u.email||"—")+'</span><br>Login-E-Mail (nicht änderbar)</div>'
    +'<div class="form-group"><label>Benutzername</label><input id="euName" value="'+escAttr(u.display_name||"")+'"></div>'
    +'<div class="form-group"><label>Rolle</label><select id="euRole"><option value="user"'+(currentRole==="user"?" selected":"")+'>User</option><option value="admin"'+(currentRole==="admin"?" selected":"")+'>Admin</option><option value="super_admin"'+(currentRole==="super_admin"?" selected":"")+'>Super Admin</option></select></div>'
    +'<div style="border-top:1px solid var(--border);padding-top:18px;margin-top:4px">'
    +'<h4 style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Neues Passwort setzen</h4>'
    +'<div class="form-group"><label>Neues Passwort</label><input id="euPw" type="password" placeholder="Leer lassen = unverändert"></div>'
    +'<div class="form-group"><label>Passwort bestätigen</label><input id="euPw2" type="password" placeholder="Wiederholen"></div>'
    +'</div>'
    +'<div id="euMsg" style="font-size:13px;min-height:18px;margin-bottom:10px;color:var(--danger)"></div>'
    +'<div style="display:flex;gap:8px"><button class="btn btn-primary" id="euSave" style="flex:1">Speichern</button><button class="btn btn-ghost" id="euCancel">Abbrechen</button></div>';
  const closePanel=()=>{overlay.style.opacity="0";overlay.style.pointerEvents="none";panel.style.transform="translateX(100%)"};
  $("euCancel").onclick=closePanel;
  $("editUserClose").onclick=closePanel;
  overlay.onclick=e=>{if(e.target===overlay)closePanel()};
  $("euSave").onclick=async()=>{
    const name=$("euName").value.trim(),role=$("euRole").value,pw=$("euPw").value,pw2=$("euPw2").value;
    const msg=$("euMsg");msg.style.color="var(--danger)";msg.textContent="";
    if(!name){msg.textContent="Benutzername darf nicht leer sein.";return}
    if(pw&&pw.length<6){msg.textContent="Passwort muss mindestens 6 Zeichen haben.";return}
    if(pw&&pw!==pw2){msg.textContent="Passwörter stimmen nicht überein.";return}
    loading(true,"Speichere…");
    const pRes=await sb.from("profiles").update({display_name:name}).eq("id",u.id);
    if(pRes.error){msg.textContent=pRes.error.message;loading(false);return}
    const mRes=await sb.from("organization_members").update({role}).eq("user_id",u.id).eq("organization_id",orgId);
    if(mRes.error){msg.textContent=mRes.error.message;loading(false);return}
    if(pw){
      try{
        const sessionRes=await sb.auth.getSession();
        const token=sessionRes.data&&sessionRes.data.session?sessionRes.data.session.access_token:null;
        if(!token){msg.textContent="Keine gültige Session.";loading(false);return}
        const res=await fetch(SUPABASE_URL+"/functions/v1/set-user-password",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({user_id:u.id,password:pw})});
        let json={};try{json=await res.json()}catch(_){}
        if(!res.ok||json.error){msg.textContent=json.error||"Passwort-Fehler (HTTP "+res.status+")";loading(false);return}
      }catch(err){msg.textContent="Netzwerkfehler: "+err.message;loading(false);return}
    }
    loading(false);msg.style.color="var(--success)";msg.textContent="✓ Gespeichert";
    setTimeout(()=>closePanel(),800);loadUsers();toast("Benutzer aktualisiert");
  };
  overlay.style.opacity="1";overlay.style.pointerEvents="all";panel.style.transform="translateX(0)";
  setTimeout(()=>$("euName")&&$("euName").focus(),100);
}

async function deleteUser(u){
  const ok=await showModal({title:escHtml(u.display_name||u.email)+" löschen?",sub:"Der User wird aus der Organisation entfernt.",confirmLabel:"Entfernen",danger:true});
  if(!ok)return;loading(true,"Entferne…");
  await sb.from("organization_members").delete().eq("user_id",u.id).eq("organization_id",orgId);
  await sb.from("profiles").delete().eq("id",u.id);
  loading(false);loadUsers();toast("Benutzer entfernt");
}

async function addUser(){
  const email=$("newUserEmail").value.trim(),name=$("newUserName").value.trim(),pw=$("newUserPw").value,role=$("newUserRole").value;
  const msgEl=$("adminMsg");msgEl.textContent="";msgEl.style.color="var(--danger)";
  if(!name||!email||!pw){msgEl.textContent="Name, E-Mail und Passwort sind erforderlich.";return}
  if(pw.length<6){msgEl.textContent="Passwort muss mindestens 6 Zeichen haben.";return}
  loading(true,"Lege User an…");
  try{
    const session=await sb.auth.getSession();
    const token=session.data&&session.data.session?session.data.session.access_token:null;
    const res=await fetch(SUPABASE_URL+"/functions/v1/create-user",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({email,password:pw,display_name:name,organization_id:orgId,role})});
    const json=await res.json();
    if(!res.ok||json.error){msgEl.textContent=json.error||"Fehler beim Anlegen.";loading(false);return}
    $("newUserName").value="";$("newUserEmail").value="";$("newUserPw").value="";
    msgEl.style.color="var(--success)";msgEl.textContent="✓ User erfolgreich angelegt.";
    _allUsers=null;loadUsers();toast("User angelegt");
  }catch(e){msgEl.textContent=e.message||"Netzwerkfehler."}
  loading(false);
}

async function submitChangePw(){
